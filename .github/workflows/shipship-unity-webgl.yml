name: ShipShip Unity WebGL Preview

on:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: "Deploy to the public GitHub Pages URL (only if you have rights to distribute the game and assets)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: shipship-unity-webgl
  cancel-in-progress: false

jobs:
  build-webgl:
    name: Build Unity WebGL 2022.3.47f1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Check Unity activation secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$UNITY_LICENSE" || -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::Missing UNITY_LICENSE, UNITY_EMAIL, or UNITY_PASSWORD. See docs/SHIPSHIP_WEBGL_AR.md."
            exit 1
          fi

      - name: Cache Unity Library for faster subsequent builds
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-WebGL-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-WebGL-

      - name: Build original card selection and battle scenes
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.47f1
          targetPlatform: WebGL
          buildMethod: ShipShipWebGLBuild.Build
          buildsPath: build
          buildName: WebGL

      - name: Validate complete browser build
        shell: bash
        run: |
          set -euo pipefail
          test -s build/WebGL/WebGL/index.html
          test -d build/WebGL/WebGL/Build
          test -d build/WebGL/WebGL/TemplateData
          find build/WebGL/WebGL/Build -maxdepth 1 -type f -print
          touch build/WebGL/WebGL/.nojekyll
          du -sh build/WebGL/WebGL

      - name: Save build for private testing / download
        uses: actions/upload-artifact@v4
        with:
          name: shipship-unity-webgl-preview
          path: build/WebGL/WebGL/
          if-no-files-found: error
          retention-days: 14

  publish-pages:
    name: Publish approved browser preview
    needs: build-webgl
    if: ${{ inputs.publish_pages == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download validated WebGL build
        uses: actions/download-artifact@v4
        with:
          name: shipship-unity-webgl-preview
          path: ./_site

      - name: Ensure publishable game exists
        shell: bash
        run: |
          set -euo pipefail
          test -s ./_site/index.html
          test -d ./_site/Build
          touch ./_site/.nojekyll

      - name: Package GitHub Pages website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy website
        uses: actions/deploy-pages@v4
        id: deployment
